name: Build User APK

on:
  workflow_dispatch:

jobs:
  build-user-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install --no-save @capacitor/cli @capacitor/android

      - name: Build User Application
        run: |
          npm run build:user

      - name: Detect User Build Output
        id: detect-build
        run: |
          echo "Searching for User build index.html..."

          if [ -f "dist-user/index.html" ]; then
            echo "Found: dist-user/index.html"
            echo "web_dir=dist-user" >> "$GITHUB_OUTPUT"

          elif [ -f "dist/index.html" ]; then
            echo "Found: dist/index.html"
            echo "web_dir=dist" >> "$GITHUB_OUTPUT"

          else
            echo "ERROR: Could not find index.html in dist-user or dist."
            echo ""
            echo "Directory listing:"
            find . -maxdepth 3 -type f -name "index.html" -print
            echo ""
            echo "Top-level directories:"
            ls -la
            exit 1
          fi

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Backup Capacitor Config
        run: |
          cp capacitor.config.ts capacitor.config.ts.backup

      - name: Configure Capacitor for User APK
        env:
          WEB_DIR: ${{ steps.detect-build.outputs.web_dir }}
        run: |
          cat > capacitor.config.ts <<EOF
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.orjonmcq.app',
            appName: 'Orjon MCQ',
            webDir: '${WEB_DIR}',
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF

          echo "Capacitor webDir: ${WEB_DIR}"

      - name: Generate Android Project
        run: |
          npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build User Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "User APK successfully created."
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload User Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Orjon-User-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
