name: Build User Android APK

on:
  workflow_dispatch:

jobs:
  build-user-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install --no-save @capacitor/cli @capacitor/android

      - name: Build User Application
        run: |
          npm run build:user

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Temporary Capacitor Config
        run: |
          cp capacitor.config.ts capacitor.config.ts.backup

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.orjonmcq.app',
            appName: 'Orjon MCQ',
            webDir: 'dist-user',
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF

      - name: Generate Android Project
        run: |
          npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload User Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Orjon-User-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
