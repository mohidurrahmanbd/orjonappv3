name: Build User APK

on:
  workflow_dispatch:

jobs:
  build-user-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install --no-save @capacitor/cli @capacitor/android

      - name: Build User Application
        run: |
          npm run build:user

      - name: Prepare Capacitor Web Assets
        run: |
          echo "Checking dist-user..."

          if [ ! -f "dist-user/index-user.html" ]; then
            echo "ERROR: dist-user/index-user.html not found."
            exit 1
          fi

          cp dist-user/index-user.html dist-user/index.html

          echo "Created Capacitor entry point:"
          ls -lh dist-user/index.html

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Backup Capacitor Config
        run: |
          cp capacitor.config.ts capacitor.config.ts.backup

      - name: Configure Capacitor for User APK
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.orjonmcq.app',
            appName: 'Orjon MCQ',
            webDir: 'dist-user',
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF

      - name: Generate Android Project
        run: |
          npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build User Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "User APK successfully created."
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload User Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Orjon-User-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
