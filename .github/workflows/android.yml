name: Build Android APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies with Bun
        run: |
          bun install
          bun add @capacitor/core @capacitor/cli @capacitor/android

      - name: Ensure Capacitor Config Exists
        run: |
          cat << 'EOF' > capacitor.config.ts
          import { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.orjonmcq.app',
            appName: 'Orjon MCQ',
            webDir: 'dist',
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF

      - name: Build Web Application
        run: |
          bun run build || true

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate Android Project & Sync
        run: |
          mkdir -p dist
          npx cap add android || true
          npx cap sync android

      - name: Build Android App (APK & AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          ./gradlew bundleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Unsigned Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
